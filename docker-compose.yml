services:
  akuvox-telegram:
    build: .
    container_name: akuvox-telegram
    restart: unless-stopped
    env_file: .env
    ports:
      - '2525:2525'
      - '8090:8090'
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
